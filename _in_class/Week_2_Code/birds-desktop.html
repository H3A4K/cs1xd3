<html>

<head>

    <title>Desktop Site</title>
    <style>
        * {
            margin: 0;

            margin-top: 20px;
            border-radius: 30px;

        }
        #nav {
            display: flex;
        }
        #content {
            display: flex;
            justify-content: space-between;
        }

        .tile img {
            width: 80%
        }
    </style>
</head>
