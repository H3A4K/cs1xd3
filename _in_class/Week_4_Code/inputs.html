<!doctype html>

Sam Scott, McMaster 2025.

<html>

<head>
    <meta charset="utf-8">
    <title>Input Examples</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:Verdana, Geneva, Tahoma, sans-serif;
        }
        #form {
            background-color: lightblue;
            border-radius: 20px;
            max-width: 500px;
            padding: 20px;
            margin: auto;
        }
        input {
            width: 100%;
            padding: 5px;
            margin-bottom: 5px;
            border-radius: 5px;
            /* styles all input elements at once */
        }
        input[type=text] {
            /* just styles text elements */
            font-size: 14px;
        }
    </style>
    <script>
        window.addEventListener("load", function(event) {
            const db = document.getElementById("donebutton");
            db.addEventListener("click", function(event) {
                console.log("clicked");
            });

            const u = document.getElementById("userid");
            u.addEventListener("input", function(event) {
                console.log(this.value);
                if (this.value.length < 8) {
                    this.style["backgroundColor"] = "pink";
                } else {
                    this.style["backgroundColor"] = "lightgreen";
                }
            });

            u.addEventListener("blur", function(event) {
                if (this.value.length >= 8) {
                    this.style["backgroundColor"] = "";
                }
            });

            const cb = document.getElementById("colorbox");
            cb.addEventListener("input", function(event) {
                const form = document.getElementById("form");
                form.style["background-color"] = this.value;
            });

        });
    </script>
</head>

<body>
    <div id="form">
        <h1>Please try these inputs!</h1>
        <input id="userid" type="text" placeholder="userid" autofocus>
        <input type="password">
        <input id="numbox" type="number">
        <input type="range" min="1" max="10">
        <input type="date" min="2025-01-01" max="2025-04-30">
        <input type="time" value="11:30">
        <input id="colorbox" type="color" value="#880000">
        <input id="donebutton" type="button" value="done">
    </div>
</body>

</html>
